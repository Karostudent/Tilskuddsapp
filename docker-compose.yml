version: '3.8'

services:
  tilskuddsapp:
    build:
      context: ./Tilskuddsapp
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    volumes:
      # Persist SQLite database on host machine
      - ./data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
    restart: unless-stopped
