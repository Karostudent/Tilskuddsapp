name: tilskuddsapp
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tilskuddsapp
      POSTGRES_USER: tilskuddsapp
      POSTGRES_PASSWORD: tilskuddsapp_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tilskuddsapp -d tilskuddsapp"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build:
      context: ./Tilskuddsapp
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=tilskuddsapp;Username=tilskuddsapp;Password=tilskuddsapp_dev
    ports:
      - "127.0.0.1:5189:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
